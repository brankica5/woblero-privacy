<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;}
  .banner{
    width:1024px;height:500px;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#bff0e0 0%,#a7e0f5 55%,#cfe8ff 100%);
    font-family:"Segoe UI",Arial,sans-serif;
  }
  .bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);}
  .b1{width:120px;height:120px;top:-30px;left:60px;}
  .b2{width:70px;height:70px;top:360px;left:30px;background:rgba(255,255,255,.28);}
  .b3{width:50px;height:50px;top:60px;left:520px;background:rgba(255,255,255,.3);}
  .b4{width:90px;height:90px;top:380px;left:900px;background:rgba(255,255,255,.25);}

  .wobli{position:absolute;left:120px;top:130px;width:290px;height:250px;}
  .body{position:absolute;left:15px;top:20px;width:260px;height:225px;
    background:radial-gradient(circle at 40% 32%,#8be8c4 0%,#43cf9a 62%,#2bb583 100%);
    border-radius:48% 52% 46% 54% / 58% 56% 44% 42%;
    box-shadow:0 18px 40px rgba(30,120,90,.35), inset -18px -22px 40px rgba(20,140,100,.35),
      inset 14px 14px 30px rgba(255,255,255,.5);}
  .shine{position:absolute;left:60px;top:52px;width:70px;height:48px;background:rgba(255,255,255,.55);
    border-radius:50%;filter:blur(2px);transform:rotate(-20deg);}
  .eye{position:absolute;top:108px;width:58px;height:66px;background:#fff;border-radius:50%;
    box-shadow:inset 0 -3px 6px rgba(0,0,0,.06);}
  .eyeL{left:78px;} .eyeR{left:150px;}
  .pupil{position:absolute;top:20px;width:36px;height:40px;background:#26303a;border-radius:50%;}
  .pupil::after{content:"";position:absolute;top:6px;left:7px;width:13px;height:13px;
    background:#fff;border-radius:50%;}
  .pupL{left:88px;} .pupR{left:160px;}
  .blush{position:absolute;top:150px;width:36px;height:20px;background:rgba(255,130,150,.55);
    border-radius:50%;filter:blur(1px);}
  .blushL{left:70px;} .blushR{left:180px;}
  .mouth{position:absolute;left:120px;top:168px;width:46px;height:24px;
    border:0;border-bottom:6px solid #26303a;border-radius:0 0 40px 40px;}

  .text{position:absolute;left:470px;top:150px;color:#12463a;}
  .title{font-size:96px;font-weight:800;letter-spacing:1px;margin:0;color:#0f5140;
    text-shadow:0 3px 0 rgba(255,255,255,.5);}
  .tag{font-size:32px;font-weight:600;margin:6px 0 0;color:#1c6b57;}
  .pills{margin-top:22px;}
  .pill{display:inline-block;background:rgba(255,255,255,.65);color:#0f5140;font-size:22px;
    font-weight:700;padding:8px 18px;border-radius:22px;margin-right:12px;}
</style>
</head>
<body>
<div class="banner">
  <div class="bubble b1"></div><div class="bubble b2"></div>
  <div class="bubble b3"></div><div class="bubble b4"></div>

  <div class="wobli">
    <div class="body"></div>
    <div class="shine"></div>
    <div class="eye eyeL"></div><div class="eye eyeR"></div>
    <div class="pupil pupL"></div><div class="pupil pupR"></div>
    <div class="blush blushL"></div><div class="blush blushR"></div>
    <div class="mouth"></div>
  </div>

  <div class="text">
    <p class="title">Woblero</p>
    <p class="tag">A soft, squishy little friend</p>
    <div class="pills">
      <span class="pill">Ages 3–6</span>
      <span class="pill">No ads</span>
      <span class="pill">Offline</span>
    </div>
  </div>
</div>
</body>
</html>
